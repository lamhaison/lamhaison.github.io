<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LHS Public Documentation Search</title>
  <link rel="stylesheet" href="./assets/search.css">
</head>
<body>

<div class="layout">
  <div class="content">

    <header class="masthead">
      <p class="eyebrow">LHS Public Documentation</p>
      <h1>Search public docs</h1>
      <p class="lede">
        Search across LHS public documentation by topic, phrase, or keyword.
      </p>
    </header>

    <div class="search-wrap">
      <label class="search-label" for="q">Search documentation</label>

      <input
        id="q"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="search public documentation"
        enterkeyhint="search">

      <p id="count" class="count" aria-live="polite"></p>

      <div
        id="sections"
        class="sections"
        role="toolbar"
        aria-label="Filter by topic">
      </div>
    </div>

    <main id="results" class="results" aria-live="polite"></main>

    <footer class="site-foot">
      <p id="generated"></p>
    </footer>

  </div>

  <aside class="toc">
    <p class="toc-label">Topics</p>
    <nav id="toc-nav" aria-label="Documentation topics"></nav>
  </aside>
</div>

<script type="module" src="./assets/search.js"></script>

</body>
</html>
